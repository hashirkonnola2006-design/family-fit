<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FamilyFit — Allergy-safe Kerala family nutrition, meal plans, and grocery tracking made for every age." />
    <meta name="theme-color" content="#1F5D3A" />
    <title>FamilyFit: Healthy Families, Happier Lives</title>

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FamilyFit: Healthy Families, Happier Lives" />
    <meta property="og:description" content="Wholesome family nutrition: allergy-safe meals, age-tailored calories, and smart grocery support." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://familyfit.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Preload Hero Image for Desktop & Mobile LCP -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      media="(min-width: 640px)"
      imagesrcset="/images/hero-800.webp 800w, /images/hero-1280.webp 1280w, /images/hero-1920.webp 1920w, /images/hero-2560.webp 2560w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      media="(max-width: 639px)"
      imagesrcset="/images/hero-mobile-800.webp 800w, /images/hero-mobile.webp 1200w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Google Fonts: Fredoka (500, 600, 700), Nunito (400, 500, 600, 700), and Caveat (500, 600, 700) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />

    <!-- JSON-LD Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FamilyFit",
        "url": "https://familyfit.app",
        "logo": "https://familyfit.app/favicon.svg",
        "description": "Wholesome family nutrition, real-time allergy shield, and meal planning for all generations."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
