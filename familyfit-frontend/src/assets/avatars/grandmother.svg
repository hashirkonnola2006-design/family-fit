  <path d="M30 92 L62 68 M38 92 L68 74" stroke="#EAB308" stroke-width="3" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="43" y="58" width="14" height="14" rx="4" fill="#FBBF24"/>
  <!-- Head / Face -->
  <circle cx="50" cy="44" r="22" fill="#FCD34D"/>
  <!-- Silver-Grey Hair with soft parting -->
  <path d="M28 42 C26 26 36 22 50 22 C64 22 74 26 72 42 C68 30 32 30 28 42 Z" fill="#94A3B8"/>
  <!-- Red Bindi -->
  <circle cx="50" cy="35" r="2.5" fill="#DC2626"/>
  <!-- Gentle Eyes -->
  <path d="M38 41 Q42 38 46 41" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M54 41 Q58 38 62 41" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cheerful Grandmother Smile -->
  <path d="M43 51 Q50 57 57 51" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Gold Earrings -->
  <circle cx="28" cy="46" r="3" fill="#EAB308"/>
  <circle cx="72" cy="46" r="3" fill="#EAB308"/>
</svg>
