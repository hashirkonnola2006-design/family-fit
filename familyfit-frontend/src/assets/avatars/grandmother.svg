<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#FEF3C7" stroke="#FDE68A" stroke-width="4"/>
  <!-- Hair Bun behind head -->
  <circle cx="50" cy="18" r="10" fill="#94A3B8"/>
