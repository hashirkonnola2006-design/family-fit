<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#FFFBEB" stroke="#FDE68A" stroke-width="4"/>
  <!-- Grandfather body / Kerala Kasavu Shawl -->
  <path d="M22 92 C22 72 35 68 50 68 C65 68 78 72 78 92 Z" fill="#F8FAFC"/>
  <!-- Kasavu Gold Border -->
  <path d="M34 69 L40 92 M66 69 L60 92" stroke="#EAB308" stroke-width="3" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="43" y="58" width="14" height="14" rx="4" fill="#FBBF24"/>
  <!-- Head / Face -->
  <circle cx="50" cy="44" r="22" fill="#FCD34D"/>
  <!-- Silver-White Hair -->
  <path d="M28 42 C26 30 36 20 50 20 C64 20 74 30 72 42 C68 28 32 28 28 42 Z" fill="#E2E8F0"/>
  <circle cx="27" cy="40" r="5" fill="#E2E8F0"/>
  <circle cx="73" cy="40" r="5" fill="#E2E8F0"/>
  <!-- Spectacles -->
  <circle cx="42" cy="42" r="6.5" fill="none" stroke="#475569" stroke-width="2.5"/>
  <circle cx="58" cy="42" r="6.5" fill="none" stroke="#475569" stroke-width="2.5"/>
  <line x1="48.5" y1="42" x2="51.5" y2="42" stroke="#475569" stroke-width="2.5"/>
  <!-- Eyes behind glasses -->
  <circle cx="42" cy="42" r="2" fill="#1E293B"/>
  <circle cx="58" cy="42" r="2" fill="#1E293B"/>
  <!-- Big White Mustache -->
  <path d="M36 50 C42 48 48 53 50 50 C52 53 58 48 64 50 C60 56 40 56 36 50 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Warm smile -->
  <path d="M46 56 Q50 59 54 56" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
