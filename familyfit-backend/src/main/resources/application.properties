# ─────────────────────────────────────────────
# Application
# ─────────────────────────────────────────────
spring.application.name=familyfit-backend
server.port=8080

# ─────────────────────────────────────────────
# DataSource (H2 in-memory DB by default, PostgreSQL if DB_URL specified)
# ─────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:mem:familyfit;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=INFO

# ─────────────────────────────────────────────
# JWT
# ─────────────────────────────────────────────
jwt.secret=${JWT_SECRET:familyfit-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# ─────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────
logging.level.com.familyfit=INFO
