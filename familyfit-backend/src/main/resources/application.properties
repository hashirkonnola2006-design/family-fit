# ─────────────────────────────────────────────
# Application
# ─────────────────────────────────────────────
spring.application.name=familyfit-backend
server.port=${PORT:8080}

# ─────────────────────────────────────────────
# DataSource (PostgreSQL by default, H2 fallback if overrides specified)
# ─────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-royal-voice-azgxrg1m.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_8dRJ1KStgQxI}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# H2 Console (fallback enabled if local H2 profile active)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=INFO

# ─────────────────────────────────────────────
# JWT
# ─────────────────────────────────────────────
jwt.secret=${JWT_SECRET:familyfit-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# ─────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────
logging.level.com.familyfit=INFO
